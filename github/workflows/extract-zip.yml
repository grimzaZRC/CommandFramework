name: Extract CommandFramework.zip

on:
  push:
    paths:
      - "CommandFramework.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract zip
        run: |
          unzip -o CommandFramework.zip -d .
          rm CommandFramework.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Extract CommandFramework.zip"
          git push
